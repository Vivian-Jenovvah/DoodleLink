plugins {
    id 'application'
    id 'org.openjfx.javafxplugin'
}

javafx { version = '21.0.6'; modules = [ 'javafx.controls', 'javafx.fxml' ] }
application { mainClass = 'com.collaborativecanvas.client.CollaborativeCanvasClient' }
dependencies {
    implementation project(':shared')
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
    implementation 'org.springframework:spring-websocket:6.2.6'
    implementation 'org.springframework:spring-messaging:6.2.6'
    runtimeOnly 'org.glassfish.tyrus.bundles:tyrus-standalone-client:2.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}
