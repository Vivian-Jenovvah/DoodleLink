services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collaborative_canvas
      POSTGRES_USER: canvas_app
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - canvas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas_app -d collaborative_canvas"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  canvas-postgres:
